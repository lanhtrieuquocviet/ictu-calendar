version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ictu_calendar_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ictu_calendar
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: ictu_calendar_be
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: ictu_calendar
      JWT_SECRET: your-secret-key
    ports:
      - '3000:3000'
    depends_on:
      - postgres
    volumes:
      - ./be:/app
      - /app/node_modules

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: ictu_calendar_fe
    ports:
      - '4200:4200'
    depends_on:
      - backend
    volumes:
      - ./fe:/app
      - /app/node_modules

volumes:
  postgres_data:
