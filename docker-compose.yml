version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ictu_calendar_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: ictu_calendar_be
    env_file:
      - ./be/.env
    ports:
      - '3000:3000'
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: ictu_calendar_fe
    ports:
      - '4200:80'
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:
