version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ictu_calendar_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: ictu_calendar_be
    restart: unless-stopped
    env_file:
      - ./be/.env
    ports:
      - '3000:3000'
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app_net
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: ictu_calendar_fe
    restart: unless-stopped
    ports:
      - '4200:80'
    networks:
      - app_net
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  uploads_data:

networks:
  app_net:
    driver: bridge
