version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ictu_calendar_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ictu_calendar
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: ictu_calendar_be
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_NAME: ictu_calendar
      JWT_SECRET: your-secret-key
    ports:
      - '3000:3000'
    depends_on:
      - mysql
    volumes:
      - ./be:/app
      - /app/node_modules

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: ictu_calendar_fe
    ports:
      - '4200:4200'
    depends_on:
      - backend
    volumes:
      - ./fe:/app
      - /app/node_modules

volumes:
  mysql_data:
