<div class="login-page">
  <div class="login-card">
    <div class="card-header">
      <div class="logo"><span>ICTU</span></div>
      <h2>Đăng nhập Admin</h2>
      <p class="sub">Quản lý lịch công tác tuần</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="admin@ictu.edu.vn" />
      </div>

      <div class="form-field">
        <label for="password">Mật khẩu</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" />
      </div>

      @if (error) {
        <div class="error-msg">{{ error }}</div>
      }

      <button class="btn-submit" type="submit" [disabled]="loading || form.invalid">
        {{ loading ? 'Đang đăng nhập...' : 'Đăng nhập' }}
      </button>
    </form>

    <div class="card-footer">
      Chưa có tài khoản? <a routerLink="/auth/register">Đăng ký</a>
    </div>
  </div>
</div>
