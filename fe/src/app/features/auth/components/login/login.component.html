<div class="login-page">
  <div class="login-card">
    <div class="card-header">
      <div class="logo"><span>ICTU</span></div>
      <h2>Đăng nhập </h2>
      <p class="sub">Quản lý lịch công tác tuần</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <!-- Email -->
      <div class="form-field" [class.has-error]="emailError">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="admin@ictu.edu.vn"
          autocomplete="email"
        />
        @if (emailError) {
          <span class="field-error">{{ emailError }}</span>
        }
      </div>

      <!-- Mật khẩu -->
      <div class="form-field" [class.has-error]="passwordError">
        <label for="password">Mật khẩu</label>
        <div class="input-wrap">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Tối thiểu 6 ký tự"
            autocomplete="current-password"
          />
          <button type="button" class="btn-eye" (click)="togglePassword()" tabindex="-1">
            @if (showPassword()) {
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
        @if (passwordError) {
          <span class="field-error">{{ passwordError }}</span>
        }
      </div>

      <!-- Lỗi từ server -->
      @if (error) {
        <div class="error-msg">{{ error }}</div>
      }

      <button class="btn-submit" type="submit" [disabled]="loading">
        @if (loading) {
          <span class="spinner"></span> Đang đăng nhập...
        } @else {
          Đăng nhập
        }
      </button>

    </form>

    <div class="card-back">
      <a routerLink="/calendar" class="back-link">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Quay lại trang lịch
      </a>
    </div>
  </div>
</div>
