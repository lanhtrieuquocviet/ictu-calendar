<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Blue background -->
  <rect width="64" height="64" rx="13" fill="#004d8a"/>
  <!-- Calendar body -->
  <rect x="10" y="20" width="44" height="34" rx="4" fill="none" stroke="white" stroke-width="4"/>
  <!-- Top bar of calendar -->
  <rect x="10" y="20" width="44" height="12" rx="4" fill="white" opacity="0.25"/>
  <!-- Rings -->
  <rect x="21" y="12" width="5" height="14" rx="2.5" fill="#f0c040"/>
  <rect x="38" y="12" width="5" height="14" rx="2.5" fill="#f0c040"/>
  <!-- Grid dots -->
  <circle cx="23" cy="42" r="3" fill="white"/>
  <circle cx="32" cy="42" r="3" fill="white"/>
  <circle cx="41" cy="42" r="3" fill="white"/>
  <circle cx="23" cy="50" r="3" fill="white"/>
  <circle cx="32" cy="50" r="3" fill="white"/>
</svg>
