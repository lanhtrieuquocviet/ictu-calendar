<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a8c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d6efd;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="12" ry="12" fill="url(#bg)"/>
  <!-- Top accent bar -->
  <rect x="8" y="8" width="48" height="4" rx="2" fill="#f0c040"/>
  <!-- "IC" text -->
  <text x="32" y="36" font-family="Arial, sans-serif" font-size="20" font-weight="900"
        text-anchor="middle" fill="white" letter-spacing="-1">IC</text>
  <!-- "TU" text -->
  <text x="32" y="54" font-family="Arial, sans-serif" font-size="14" font-weight="700"
        text-anchor="middle" fill="#f0c040" letter-spacing="1">TU</text>
</svg>
